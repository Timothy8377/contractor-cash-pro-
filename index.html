<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contractor Cash Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{background:#1a2940;padding:22px;text-align:center}
h1,h2{color:#22c55e}
h1{font-size:27px}
header p{color:#cbd5e1}
main{max-width:750px;margin:auto;padding:15px}
.card{background:#1e293b;padding:18px;border-radius:12px;margin-bottom:15px}
input,select,textarea{
width:100%;padding:12px;margin:7px 0;
background:#0f172a;color:white;
border:1px solid #64748b;border-radius:7px;
font-size:16px
}
textarea{min-height:85px}
button{
background:#22c55e;color:#052e16;
border:0;border-radius:8px;padding:13px;
font-weight:bold;font-size:15px;
margin:5px 0;cursor:pointer
}
.full{width:100%}
.secondary{background:#475569;color:white}
nav{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:12px}
nav button{font-size:13px}
section{display:none}
section.active{display:block}
label{display:block;margin-top:10px}
.total{font-size:25px;color:#4ade80;font-weight:bold}
.record{padding:12px;border-bottom:1px solid #475569}
canvas{background:white;touch-action:none;width:100%;height:160px;border-radius:8px}
img.logo{max-width:140px;max-height:100px}
footer{text-align:center;padding:25px;color:#94a3b8}
@media print{
header,nav,button,.no-print,footer{display:none!important}
body,main,.card{background:white;color:black}
section{display:none!important}
section.active{display:block!important}
input,textarea,select{background:white;color:black;border:0}
h1,h2,.total{color:black}
canvas{border:1px solid #ccc}
}
</style>
</head>
<body>

<header>
<h1>💰 Contractor Cash Pro</h1>
<p>Created by Timothy Polston</p>
<p>Run Your Business. Build Your Profit.</p>
</header>

<nav class="no-print">
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('estimates')">Estimates</button>
<button onclick="show('contracts')">Contracts</button>
<button onclick="show('timesheets')">Timesheets</button>
<button onclick="show('customers')">Customers</button>
<button onclick="show('industrial')">Industrial</button>
</nav>

<main>

<section id="dashboard" class="active">
<div class="card">
<h2>Business Dashboard</h2>
<label>Business Name</label>
<input id="business" placeholder="Company name">
<label>Business Phone</label>
<input id="phone" placeholder="Phone number">
<label>Company Logo</label>
<input type="file" accept="image/*" id="logoInput">
<img id="logoPreview" class="logo">
<button class="full" onclick="saveBusiness()">Save Business Information</button>
</div>

<div class="card">
<h2>Business Overview</h2>
<p>Saved Jobs: <strong id="jobCount">0</strong></p>
<p>Total Estimated / Invoiced: <strong id="revenue">$0.00</strong></p>
<p>Paid Invoices: <strong id="paid">$0.00</strong></p>
<p>Unpaid Invoices: <strong id="unpaid">$0.00</strong></p>
<p>Estimated Job Profit: <strong id="profit">$0.00</strong></p>
</div>
</section>

<section id="estimates">
<div class="card">
<h2>Estimates & Invoices</h2>
<select id="docType">
<option>Estimate</option>
<option>Invoice</option>
